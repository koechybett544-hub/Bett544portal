<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reberwet Junior Secondary School Portal</title>
    <meta name="description" content="Comprehensive 100% offline school portal for Reberwet JSS featuring CBC marks assessment, weekly lesson timetables, learner profiles, report cards, and academic management." />
    <meta property="og:title" content="Reberwet Junior Secondary School Portal" />
    <meta property="og:description" content="Comprehensive 100% offline school portal for Reberwet JSS featuring CBC marks assessment, weekly lesson timetables, learner profiles, report cards, and academic management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#6b1426" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Reberwet JSS" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('reberwet_theme_mode');
          var isDark = mode === 'dark' || (!mode && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0c0a09');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#faf8f5] dark:bg-stone-950 text-stone-900 dark:text-stone-100 antialiased min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
